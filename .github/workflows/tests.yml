name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q bot.py db.py texts.py assets.py scripts tests
      - run: python -c "import bot, db, texts, assets"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
